name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate repo (assets, data, content, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repo validator
        run: python scripts/validate_repo.py

      - name: Lint theme PHP
        run: |
          set -e
          for f in $(find themes plugins seed -name '*.php' -not -path '*/node_modules/*'); do
            php -l "$f" >/dev/null
          done
        shell: bash

      - name: Functional test calculators (node harness)
        run: |
          mkdir -p .temp/jscheck
          python - <<'PYEOF'
          import re, pathlib
          out = pathlib.Path('.temp/jscheck')
          for f in sorted(pathlib.Path('tools').glob('*.html')):
              m = re.search(r'<script>(.*?)</script>', f.read_text(encoding='utf-8'), re.S)
              if m:
                  (out / (f.stem + '.js')).write_text(m.group(1), encoding='utf-8')
          print('extracted', len(list(out.glob('*.js'))), 'calculator scripts')
          PYEOF
          node scripts/test_calculators.js .temp/jscheck
        shell: bash

      - name: Verify terminal shell template + tool divs
        run: |
          grep -q "w3d@terminal" themes/w3d/page-terminal.php
          for f in tools/*.html; do
            slug=$(basename "$f" .html)
            grep -q "id=\"tool-$slug\"" "$f" || (echo "missing div in $f" && exit 1)
          done
          echo "shell template + 15 tool divs OK"
        shell: bash