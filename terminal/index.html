    <!--
      This app is built with the React Router rooted at "/". When deployed under
      /terminal/ the router otherwise receives "/terminal/" and falls into the
      catch-all 404. Shift the visible path to the app root before boot so the
      dashboard renders, and so deep links (/terminal/chains/btc) map in-app.
    -->
    <script>
    (function () {
      try {
        var path = window.location.pathname;
        if (path.indexOf('/terminal') === 0) {
          var rest = path.slice('/terminal'.length);
          rest = rest === '' ? '/' : rest;
          window.history.replaceState(window.history.state, '', rest + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();
    </script>
